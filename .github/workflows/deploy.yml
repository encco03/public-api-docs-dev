name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # follow the stage gateway bundle without a commit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the live spec
        run: node scripts/download-spec.mjs
        env:
          EASYDMARC_PUBLIC_API_SPEC_URL: ${{ vars.EASYDMARC_PUBLIC_API_SPEC_URL }}
          EASYDMARC_DEV_API_SPEC_URL: ${{ vars.EASYDMARC_DEV_API_SPEC_URL }}

      - name: Clean generated docs and sidebar
        # The plugin never overwrites an existing sidebar.ts, so the committed one would shadow the fresh spec.
        run: npx docusaurus clean-api-docs all

      - name: Generate API docs
        run: npx docusaurus gen-api-docs all
        env:
          EASYDMARC_PUBLIC_API_SPEC_URL: ${{ vars.EASYDMARC_PUBLIC_API_SPEC_URL }}

      - name: Build
        run: npx docusaurus build
        env:
          EASYDMARC_PUBLIC_API_SPEC_URL: ${{ vars.EASYDMARC_PUBLIC_API_SPEC_URL }}
          # custom domain developers.easydmarc.am serves the site at the root
          BASE_URL: /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
